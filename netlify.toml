# Deploy no Netlify: frontend estático + API em functions.
[build]
  publish = "frontend"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions.api]
  external_node_modules = ["knex", "pg"]

# /api/* -> function única (backend autenticado)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

# fallback do PWA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
